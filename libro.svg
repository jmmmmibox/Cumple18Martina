<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b07848"/>
      <stop offset="40%" style="stop-color:#9a6438"/>
      <stop offset="100%" style="stop-color:#7a4a20"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5a3210"/>
      <stop offset="100%" style="stop-color:#7a4e28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8962a"/>
      <stop offset="40%" style="stop-color:#f0c84a"/>
      <stop offset="100%" style="stop-color:#b87820"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c09060"/>
      <stop offset="100%" style="stop-color:#9a6438"/>
    </linearGradient>
    <filter id="leather">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- LOMO -->
  <polygon points="12,18 38,8 38,252 12,242" fill="url(#spine)"/>
  <line x1="12" y1="50" x2="38" y2="43" stroke="#c8962a" stroke-width="1" opacity="0.7"/>
  <line x1="12" y1="55" x2="38" y2="48" stroke="#c8962a" stroke-width="0.5" opacity="0.4"/>
  <line x1="12" y1="200" x2="38" y2="193" stroke="#c8962a" stroke-width="1" opacity="0.7"/>
  <line x1="12" y1="205" x2="38" y2="198" stroke="#c8962a" stroke-width="0.5" opacity="0.4"/>

  <!-- CUBIERTA -->
  <rect x="38" y="8" width="152" height="244" rx="3" ry="3" fill="url(#cover)" filter="url(#leather)"/>
  <rect x="38" y="8" width="152" height="244" rx="3" ry="3" fill="none" stroke="#5a3210" stroke-width="1.5"/>

  <!-- Marco interior -->
  <rect x="50" y="20" width="128" height="220" rx="2" ry="2" fill="none" stroke="#7a4a20" stroke-width="1.2" opacity="0.6"/>
  <rect x="53" y="23" width="122" height="214" rx="1.5" ry="1.5" fill="none" stroke="#c09060" stroke-width="0.6" opacity="0.4"/>

  <!-- CANTO dorado -->
  <rect x="188" y="12" width="6" height="236" fill="url(#gold)"/>

  <!-- TAPA superior -->
  <polygon points="12,18 38,8 190,8 190,14 38,14 12,24" fill="url(#top)" opacity="0.9"/>

  <!-- Bandas doradas -->
  <rect x="38" y="28" width="152" height="4" fill="#c8962a" opacity="0.4" rx="1"/>
  <rect x="38" y="30" width="152" height="1" fill="#f0c84a" opacity="0.55"/>
  <rect x="38" y="216" width="152" height="4" fill="#c8962a" opacity="0.4" rx="1"/>
  <rect x="38" y="218" width="152" height="1" fill="#f0c84a" opacity="0.55"/>

  <!-- TEXTO "Felices" — color muy oscuro con sombra clara para contraste -->
  <!-- Capa luz (relieve superior) -->
  <text x="113" y="116"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36" font-style="italic" font-weight="bold"
    text-anchor="middle" fill="rgba(200,160,100,.45)" letter-spacing="-1">Felices</text>
  <!-- Capa principal oscura -->
  <text x="114" y="117"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36" font-style="italic" font-weight="bold"
    text-anchor="middle" fill="#2a1200" opacity="0.85" letter-spacing="-1">Felices</text>

  <!-- TEXTO "18" -->
  <text x="113" y="167"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="60" font-weight="bold"
    text-anchor="middle" fill="rgba(200,160,100,.4)">18</text>
  <text x="114" y="168"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="60" font-weight="bold"
    text-anchor="middle" fill="#2a1200" opacity="0.8">18</text>

  <!-- Ornamento -->
  <circle cx="90" cy="186" r="2" fill="#c8962a" opacity="0.6"/>
  <circle cx="114" cy="186" r="2.5" fill="#c8962a" opacity="0.7"/>
  <circle cx="138" cy="186" r="2" fill="#c8962a" opacity="0.6"/>

  <!-- Reflejo sutil -->
  <rect x="55" y="30" width="25" height="180" rx="5" fill="white" opacity="0.05"/>
</svg>
